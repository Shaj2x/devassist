[project]
name = "devassist-orchestrator"
version = "0.1.0"
description = "DevAssist multi-agent orchestrator."
requires-python = ">=3.11"
dependencies = [
    "devassist-common",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devassist_orchestrator"]
