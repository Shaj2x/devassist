apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devassist
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  tls:
    - hosts: [devassist.example.com]
      secretName: devassist-tls
  rules:
    - host: devassist.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: dashboard, port: { name: http } }
