# Single-node Kafka in KRaft mode (broker and controller in one process).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels: { app.kubernetes.io/name: kafka }
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: kafka }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kafka }
    spec:
      securityContext:
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: kafka
          image: apache/kafka:3.8.1
          ports:
            - { name: kafka, containerPort: 9092 }
            - { name: controller, containerPort: 9093 }
          env:
            - { name: CLUSTER_ID, value: 4L6g3nShT-eMCtK--X86sw }
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
            - { name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data }
          readinessProbe:
            tcpSocket: { port: kafka }
            periodSeconds: 5
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1536Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 5Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels: { app.kubernetes.io/name: kafka }
spec:
  selector: { app.kubernetes.io/name: kafka }
  ports:
    - { name: kafka, port: 9092, targetPort: kafka }
---
# Creates every topic and its dead-letter topic (same list as
# deploy/kafka/create-topics.sh). Idempotent; retries until Kafka is up.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  labels: { app.kubernetes.io/name: kafka-topics }
spec:
  backoffLimit: 30
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app.kubernetes.io/name: kafka-topics }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: topics
          image: apache/kafka:3.8.1
          command:
            - /bin/bash
            - -ec
            - |
              for t in repo.registered repo.indexed job.created patch.generated validation.completed job.completed; do
                for name in "$t" "$t.dlq"; do
                  /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
                    --topic "$name" --partitions 3 --replication-factor 1 --config retention.ms=604800000
                done
              done
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 512Mi }
