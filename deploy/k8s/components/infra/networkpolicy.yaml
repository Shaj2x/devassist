# Infrastructure accepts connections from DevAssist pods in this namespace only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: infra-from-namespace
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [postgres, redis, kafka]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
