apiVersion: apps/v1
kind: Deployment
metadata:
  name: indexer
  labels: { app.kubernetes.io/name: indexer }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: indexer }
  template:
    metadata:
      labels: { app.kubernetes.io/name: indexer }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: indexer
          image: devassist/indexer
          args: ["serve"]
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: devassist-config }
          env:
            - { name: PORT, value: "8080" }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: devassist-secrets, key: DATABASE_URL } }
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: devassist-secrets, key: REDIS_URL } }
            - name: OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: devassist-secrets, key: OPENAI_API_KEY, optional: true } }
            - name: VOYAGE_API_KEY
              valueFrom: { secretKeyRef: { name: devassist-secrets, key: VOYAGE_API_KEY, optional: true } }
            - name: GITHUB_TOKEN
              valueFrom: { secretKeyRef: { name: devassist-secrets, key: GITHUB_TOKEN, optional: true } }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp  # clones being indexed
          emptyDir: { sizeLimit: 4Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: indexer
  labels: { app.kubernetes.io/name: indexer }
spec:
  selector: { app.kubernetes.io/name: indexer }
  ports:
    - { name: http, port: 8080, targetPort: http }
