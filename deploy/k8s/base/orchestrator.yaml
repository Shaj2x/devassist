# Runs the agent loop. Work arrives on Kafka (job.created), so replicas
# scale with consumer lag rather than CPU: most of a job is spent waiting on
# the model and the sandbox (see overlays/prod/keda.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  labels: { app.kubernetes.io/name: orchestrator }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: orchestrator }
  template:
    metadata:
      labels: { app.kubernetes.io/name: orchestrator }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: /metrics
    spec:
      # A job interrupted by shutdown is redelivered and re-run elsewhere;
      # the grace period lets short steps finish first.
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: orchestrator
          image: devassist/orchestrator
          ports:
            - { name: http, containerPort: 8001 }
          envFrom:
            - configMapRef: { name: devassist-config }
          env:
            - { name: PORT, value: "8001" }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: devassist-secrets, key: DATABASE_URL } }
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: devassist-secrets, key: REDIS_URL } }
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: devassist-secrets, key: ANTHROPIC_API_KEY, optional: true } }
            - name: OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: devassist-secrets, key: OPENAI_API_KEY, optional: true } }
            - name: GITHUB_TOKEN
              valueFrom: { secretKeyRef: { name: devassist-secrets, key: GITHUB_TOKEN, optional: true } }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            # 503 when the Kafka worker loop has died.
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 60
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp  # per-job clones
          emptyDir: { sizeLimit: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  labels: { app.kubernetes.io/name: orchestrator }
spec:
  selector: { app.kubernetes.io/name: orchestrator }
  ports:
    - { name: http, port: 8001, targetPort: http }
