server {
    listen 8080;
    root /usr/share/nginx/html;

    # API_UPSTREAM is resolved at request time via Docker's DNS, so nginx
    # starts even if the api container is still coming up.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        # Server-sent events for live job progress (Phase 6).
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Client-side routing: unknown paths serve the SPA.
    location / {
        try_files $uri /index.html;
    }
}
